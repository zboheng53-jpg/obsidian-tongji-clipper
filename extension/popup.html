<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>同济课程剪藏</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="clipper" aria-labelledby="title">
      <header class="titlebar">
        <span class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" role="img">
            <path d="M12 2.25 20.1 8l-2.8 10.3L12 21.75l-5.3-3.45L3.9 8 12 2.25Z"></path>
            <path d="m12 5.6 4.7 3.3-1.65 6.15L12 17l-3.05-1.95L7.3 8.9 12 5.6Z"></path>
          </svg>
        </span>
        <div>
          <h1 id="title">课程剪藏</h1>
          <p>保存到 Obsidian</p>
        </div>
      </header>

      <label class="path-field" for="relative-path">
        <span>保存文件夹（绝对路径）</span>
        <input
          id="relative-path"
          type="text"
          value=""
          placeholder="D:\\Obsidian\\竞赛库\\11_比赛现场速查包"
          autocomplete="off"
          spellcheck="false"
        >
      </label>

      <p id="status" class="status" role="status" aria-live="polite"></p>

      <button id="clip-button" class="clip-button" type="button">
        <span>剪藏到 Obsidian</span>
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <path d="m7.5 4.75 5.25 5.25-5.25 5.25"></path>
        </svg>
      </button>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
