<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>同济课程逐字稿采集器</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="title-bar">
      <h2>同济课程逐字稿</h2>
      <div class="title-right">
        <span id="worker-badge" class="badge badge-waiting">服务检测中</span>
        <button id="btn-open-dashboard" class="btn-link-header" title="打开常驻任务中心">任务中心 ↗</button>
      </div>
    </div>
  </div>

  <div id="not-course-page" class="card warning hidden">
    <p>⚠️ 请在同济大学课程页面使用：<br><code>https://look.tongji.edu.cn/livingroom?...</code></p>
    <button id="btn-open-dashboard-alt" class="btn-link" style="margin-top:6px;display:inline-block;">打开常驻任务中心 ↗</button>
  </div>

  <div id="media-not-ready" class="card warning hidden">
    <div class="section-header">
      <p>⏳ 尚未检测到课程媒体流或视频未播放。</p>
      <button id="btn-refresh-capture-alt" class="btn-link">重新探测</button>
    </div>
    <p class="tip">提示：请确保页面已加载并已开始播放视频。</p>
  </div>

  <div id="capture-container" class="card hidden">
    <div class="section-header">
      <h3>当前课程信息</h3>
      <button id="btn-refresh-capture" class="btn-link">重新探测</button>
    </div>
    <div class="info-group">
      <label>课程：</label>
      <div id="course-title" class="val">-</div>
    </div>
    <div class="info-group">
      <label>课时：</label>
      <div id="sub-title" class="val">-</div>
    </div>
    <div class="info-row">
      <div class="info-group half">
        <label>教师：</label>
        <div id="lecturer-name" class="val">-</div>
      </div>
      <div class="info-group half">
        <label>教室：</label>
        <div id="room-name" class="val">-</div>
      </div>
    </div>
    <div class="info-group">
      <label for="stream-select">媒体画面流：</label>
      <select id="stream-select"></select>
    </div>

    <!-- 转写配置摘要（轻量展示，详细设置位于任务中心） -->
    <div class="summary-box">
      <div class="summary-box-header">
        <span class="summary-box-title">转写配置摘要</span>
        <button id="btn-open-settings" class="btn-link" title="在任务中心中修改设置">修改设置 ⚙</button>
      </div>
      <div class="summary-box-row">
        <span class="summary-label">生效模型：</span>
        <span id="summary-model" class="summary-val">正在加载配置...</span>
      </div>
      <div class="summary-box-row">
        <span class="summary-label">资源档位：</span>
        <span id="summary-profile" class="summary-val">平衡模式（推荐）</span>
      </div>
      <div class="summary-box-row">
        <span class="summary-label">运行/存储：</span>
        <span id="summary-flags" class="summary-val">在线模式 · 默认目录</span>
      </div>
    </div>

    <button id="btn-submit" class="btn btn-primary">提交转写任务</button>
    <div class="tip notice-tip">
      提交后将在后台独立转写；音频提取就绪后即可关闭网页；可在任务中心查看完整进度、逐字稿与产物。
    </div>
  </div>

  <div class="card">
    <div class="section-header">
      <h3>本地转写任务</h3>
      <div class="header-actions">
        <button id="btn-open-dashboard-tasks" class="btn-link" title="查看所有任务、预览逐字稿、导出笔记">完整任务中心 ↗</button>
        <button id="btn-refresh-tasks" class="btn-link">刷新</button>
      </div>
    </div>
    <p class="tip notice-tip">每 2 秒自动更新 · 百分比表示转写阶段进度<br><span id="tasks-sync-status">正在读取进度…</span></p>
    <div id="tasks-list" class="tasks-list">
      <div class="empty">暂无任务记录</div>
    </div>
  </div>

  <div id="message-bar" class="message-bar hidden"></div>

  <script src="common-client.js"></script>
  <script src="popup.js"></script>
</body>
</html>
