<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tongji Course Clipper 设置</title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <div class="page-shell">
      <header class="masthead">
        <div class="brand-mark" aria-hidden="true">同</div>
        <div>
          <p class="eyebrow">LOCAL COURSE ARCHIVE · 本地课程档案</p>
          <h1>Tongji Course Clipper</h1>
          <p class="lede">选择你的 Obsidian 仓库，课程回放就会在本机转写并归档。</p>
        </div>
        <div class="service-chip" id="service-chip" data-state="checking" role="status">
          <span class="signal" aria-hidden="true"></span>
          <span id="service-label">正在连接本地服务</span>
        </div>
      </header>

      <main>
        <section class="setup-card" aria-labelledby="vault-title">
          <div class="step-index" aria-hidden="true">01</div>
          <div class="section-copy">
            <p class="section-kicker">归档位置</p>
            <h2 id="vault-title">选择 Obsidian Vault</h2>
            <p>点击按钮后会打开 Windows 文件夹选择窗口。路径只保存在这台电脑上。</p>
          </div>
          <div class="vault-control">
            <div class="path-display" id="vault-path" title="尚未选择">尚未选择 Vault</div>
            <button class="button button-primary" id="select-vault" type="button" disabled>
              选择文件夹
            </button>
          </div>
          <div class="inline-message" id="vault-message" hidden></div>
        </section>

        <section class="settings-grid" aria-labelledby="settings-title">
          <div class="step-index" aria-hidden="true">02</div>
          <div class="section-copy settings-heading">
            <p class="section-kicker">转写偏好</p>
            <h2 id="settings-title">设置笔记生成方式</h2>
          </div>

          <label class="field field-wide">
            <span class="field-label">笔记子目录</span>
            <span class="field-help">相对于所选 Vault，例如“课程笔记/自动转写”</span>
            <input id="notes-subdir" name="notes_subdir" type="text" value="课程笔记" autocomplete="off" disabled>
          </label>

          <label class="field">
            <span class="field-label">Whisper 模型</span>
            <span class="field-help">模型越大通常越准确，也越慢</span>
            <select id="model" name="model" disabled>
              <option value="tiny">Tiny · 最快</option>
              <option value="base">Base · 较快</option>
              <option value="small" selected>Small · 推荐</option>
              <option value="medium">Medium · 更准确</option>
            </select>
          </label>

          <label class="toggle-field">
            <span>
              <span class="field-label">保留临时视频</span>
              <span class="field-help">默认在转写完成或失败后删除</span>
            </span>
            <input id="keep-media" name="keep_temporary_media" type="checkbox" disabled>
            <span class="toggle" aria-hidden="true"></span>
          </label>

          <div class="form-actions">
            <button class="button button-secondary" id="save-settings" type="button" disabled>保存设置</button>
            <span class="save-state" id="save-state" aria-live="polite"></span>
          </div>
        </section>

        <section class="test-card" aria-labelledby="test-title">
          <div class="step-index" aria-hidden="true">03</div>
          <div class="section-copy">
            <p class="section-kicker">完成检查</p>
            <h2 id="test-title">测试写入</h2>
            <p>在笔记目录生成一份测试 Markdown，确认 Obsidian 能看到它。</p>
          </div>
          <button class="button button-ink" id="test-write" type="button" disabled>生成测试笔记</button>
          <div class="test-result" id="test-result" aria-live="polite" hidden></div>
        </section>
      </main>

      <footer>
        <p>全部视频与语音识别都在本机处理，不调用云端 LLM。</p>
        <button class="text-button" id="retry-service" type="button">重新检测服务</button>
        <span id="service-version"></span>
      </footer>
    </div>

    <div class="toast" id="toast" role="alert" hidden></div>
    <script src="options.js"></script>
  </body>
</html>
